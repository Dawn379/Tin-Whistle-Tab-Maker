<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洞洞谱转换器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#eef0f6;
    --bg-1:#e9eaf2;
    --bg-2:#f1eef0;
    --glass:rgba(255,255,255,0.5);
    --glass-strong:rgba(255,255,255,0.75);
    --glass-border:rgba(180,148,158,0.28);
    --glass-border-strong:rgba(196,142,151,0.5);
    --gold:#cdb27c;
    --gold-bright:#e2cd9c;
    --gold-dim:#a4906a;
    --rose:#c18d94;
    --rose-bright:#d5a4a9;
    --rose-dim:#a06e73;
    --ink:#2c2b32;
    --ink-dim:#57555f;
    --ink-mute:#8d8b96;
    --ink-on-accent:#ffffff;
    --danger:#b3423f;
    --font-serif:'Noto Serif SC', serif;
    --font-en:'Cormorant Garamond', serif;
    --font-sans:'Noto Sans SC', sans-serif;
    --font-mono:'JetBrains Mono', 'Consolas', monospace;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-width:1080px;
    font-family:var(--font-sans);
    color:var(--ink);
    background:
      radial-gradient(ellipse 900px 500px at 50% -8%, rgba(205,178,124,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 10%, rgba(193,141,148,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    min-height:100vh;
    padding:32px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow-y:auto;
  }

  .page{
    width:100%;
    margin:0 auto;
  }

  /* ---------- header ---------- */
  .header{
    text-align:center;
    margin-bottom:48px;
  }
  .eyebrow{
    font-family:var(--font-en);
    font-style:italic;
    letter-spacing:0.32em;
    font-size:14px;
    color:var(--rose-dim);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .title{
    font-family:var(--font-serif);
    font-weight:700;
    font-size:40px;
    letter-spacing:0.06em;
    color:var(--ink);
    margin:0 0 18px;
  }
  .title span{color:var(--rose);}
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    color:var(--gold-dim);
  }
  .divider .line{
    width:120px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--glass-border-strong));
  }
  .divider .line.right{background:linear-gradient(90deg, var(--glass-border-strong), transparent);}
  .divider .diamond{
    width:6px;height:6px;
    background:var(--gold);
    transform:rotate(45deg);
    box-shadow:0 0 8px rgba(205,178,124,0.6);
  }
  /* ---------- mode switcher ---------- */
  .mode-switcher{
    display:inline-flex;
    gap:4px;
    margin-top:16px;
    padding:4px;
    border-radius:999px;
    background:rgba(255,255,255,0.4);
    border:0.5px solid var(--glass-border);
  }
  .mode-btn{
    font-family:var(--font-sans);
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.02em;
    padding:6px 16px;
    border-radius:999px;
    border:none;
    background:transparent;
    color:var(--ink-mute);
    cursor:pointer;
    transition:all 0.18s;
  }
  .mode-btn:hover{ color:var(--ink-dim); }
  .mode-btn:focus-visible{ outline:2px solid var(--rose); outline-offset:2px; }
  .mode-btn.active{
    background:linear-gradient(135deg, var(--rose-bright), var(--rose));
    color:var(--ink-on-accent);
    font-weight:600;
    box-shadow:0 2px 8px rgba(193,141,148,0.3);
  }

  /* ---------- glass card ---------- */
  .glass{
    background:var(--glass);
    border:0.5px solid var(--glass-border);
    border-radius:18px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 60px rgba(120,105,140,0.10), 0 2px 10px rgba(120,105,140,0.06);
  }

  /* ---------- main grid ---------- */
  .workspace{
    display:flex;
    gap:24px;
    align-items:flex-start;
    justify-content:center;
  }

  .panel{
    padding:22px 24px 24px;
    display:flex;
    flex-direction:column;
    min-height:480px;
  }
  .panel.input-panel{
    width:auto;
  }
  .panel.output-panel{
    width:auto;
  }
  .panel-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-serif);
    font-size:15px;
    font-weight:600;
    color:var(--rose-dim);
    margin-bottom:4px;
  }
  .panel-label .num{
    font-family:var(--font-en);
    font-style:italic;
    font-size:13px;
    color:var(--gold-dim);
  }
  .panel-hint{
    font-size:12px;
    color:var(--ink-mute);
    margin-bottom:14px;
    line-height:1.6;
  }

  /* ---------- input ---------- */
  #title-box{
    width:100%;
    background:rgba(255,255,255,0.4);
    border:0.5px solid var(--glass-border);
    border-radius:12px;
    padding:10px 18px;
    color:var(--ink);
    font-family:var(--font-sans);
    font-size:15px;
    letter-spacing:0.02em;
    outline:none;
    transition:border-color 0.2s;
    margin-bottom:10px;
  }
  #title-box::placeholder{color:var(--ink-mute); opacity:0.8;}
  #title-box:focus{border-color:var(--glass-border-strong); box-shadow:0 0 0 3px rgba(193,141,148,0.1);}

  #input-box{
    flex:1;
    width:100%;
    resize:none;
    background:rgba(255,255,255,0.4);
    border:0.5px solid var(--glass-border);
    border-radius:12px;
    padding:16px 18px;
    color:var(--ink);
    font-family:var(--font-mono);
    font-size:16px;
    line-height:2;
    letter-spacing:0.02em;
    outline:none;
    transition:border-color 0.2s;
  }
  #input-box::placeholder{color:var(--ink-mute); opacity:0.8;}
  #input-box:focus{border-color:var(--glass-border-strong); box-shadow:0 0 0 3px rgba(193,141,148,0.1);}

  .error-bar{
    margin-top:12px;
    padding:10px 14px;
    border-radius:10px;
    background:rgba(179,66,63,0.08);
    border:0.5px solid rgba(179,66,63,0.3);
    color:var(--danger);
    font-size:12.5px;
    line-height:1.7;
    display:none;
  }
  .error-bar.show{display:block;}

  /* ---------- output ---------- */
  #output-wrap{
    flex:1;
    background:rgba(255,255,255,0.4);
    border:0.5px solid var(--glass-border);
    border-radius:12px;
    padding:22px 20px;
    overflow-x:auto;
    overflow-y:auto;
    max-height:560px;
  }
  #output-wrap.empty{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-mute);
    font-size:13px;
    font-family:var(--font-serif);
  }

  .row{
    display:flex;
    align-items:stretch;
    margin-bottom:30px;
  }
  .row:last-child{margin-bottom:0;}

  .measure{
    display:flex;
    align-items:flex-start;
    gap:16px;
    padding:0 18px;
  }
  .measure:first-child{padding-left:2px;}

  .barline{
    width:1px;
    align-self:stretch;
    background:linear-gradient(180deg, transparent, var(--rose-bright) 15%, var(--rose-bright) 85%, transparent);
    margin:0 2px;
    position:relative;
    opacity:0.65;
  }
  .barline::before{
    content:'';
    position:absolute;
    left:-1px;top:0;bottom:0;
    width:3px;
    background:radial-gradient(circle, rgba(193,141,148,0.3), transparent 70%);
  }

  .beat{
    display:flex;
    gap:5px;
  }

  .cell{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .cell-char{
    font-family:var(--font-mono);
    font-size:16px;
    font-weight:500;
    color:var(--ink);
    height:20px;
    line-height:20px;
    white-space:nowrap;
    margin-bottom:8px;
  }
  .cell-char.rest{color:var(--ink-mute);}
  .cell-char.blank{color:var(--ink-mute); opacity:0.55;}
  .cell-char.err{color:var(--danger); text-decoration:underline wavy var(--danger);}

  .cell-img{
    height:96px;
    width:22px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .cell-img img{
    height:96px;
    width:auto;
    display:block;
    filter:drop-shadow(0 2px 5px rgba(90,80,100,0.18));
  }
  .cell-img.err-box{
    height:20px;
    align-self:flex-start;
    width:20px;
    border:1px dashed var(--danger);
    border-radius:4px;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
  }
  button{
    font-family:var(--font-sans);
    font-size:13.5px;
    font-weight:500;
    letter-spacing:0.02em;
    padding:10px 20px;
    border-radius:999px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:all 0.18s;
  }
  .btn-ghost{
    background:rgba(255,255,255,0.35);
    border:0.5px solid var(--glass-border);
    color:var(--ink-dim);
  }
  .btn-ghost:hover{
    border-color:var(--glass-border-strong);
    color:var(--ink);
    background:rgba(255,255,255,0.6);
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--rose-bright), var(--rose));
    border:0.5px solid var(--rose-bright);
    color:var(--ink-on-accent);
    font-weight:600;
  }
  .btn-primary:hover{
    box-shadow:0 6px 20px rgba(193,141,148,0.35);
    transform:translateY(-1px);
  }
  .btn-primary:active, .btn-ghost:active{transform:scale(0.97);}

  .icon{width:14px;height:14px;flex-shrink:0;}

  .toast{
    position:fixed;
    bottom:36px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:rgba(44,43,50,0.92);
    border:0.5px solid rgba(255,255,255,0.12);
    color:#ffffff;
    padding:11px 22px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all 0.25s;
    backdrop-filter:blur(6px);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  #export-canvas{display:none;}
</style>
</head>
<body>

<div class="page">

  <div class="header">
    <div class="eyebrow">Jianpu · Dongdong Notation</div>
    <h1 class="title">洞<span>洞</span>谱转换器</h1>
    <div class="divider">
      <span class="line"></span>
      <span class="diamond"></span>
      <span class="line right"></span>
    </div>
    <div class="mode-switcher" role="group" aria-label="指法模式">
      <button class="mode-btn active" id="btn-mode-5" aria-pressed="true">全按作 5</button>
      <button class="mode-btn" id="btn-mode-2" aria-pressed="false">全按作 2</button>
    </div>
  </div>

  <div class="workspace">

    <div class="panel input-panel glass">
      <div class="panel-label"><span class="num">01</span> 输入简谱</div>
      <div class="panel-hint">支持 1-7（中音）· #1 #2 #3（高音）· b5 b6 b7（低音）· 0（休止符）· - 及 . （延音/附点，不占谱）· | （小节线）<br>拍与拍之间用空格分隔，例如 12 3 表示八分音符+四分音符。</div>
      <input id="title-box" type="text" placeholder="谱子名字（必填）">
      <textarea id="input-box" placeholder="例如：1 2 3. 4 | #1 12 3 0 | b5 6 7 1 | 5-- 5-- 5 6"></textarea>
      <div class="error-bar" id="error-bar"></div>
    </div>

    <div class="panel output-panel glass">
      <div class="panel-label"><span class="num">02</span> 洞洞谱结果</div>
      <div class="panel-hint">按回车换行，输入框中每一行对应洞洞谱的一行，可直接导出为图片。</div>
      <div id="output-wrap" class="empty">
        <span id="output" ></span>
        <span id="empty-tip">在左侧输入简谱，这里会实时显示对应的洞洞谱</span>
      </div>
      <div class="toolbar">
        <button class="btn-ghost" id="btn-clear">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          清空
        </button>
        <button class="btn-ghost" id="btn-copy">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制简谱
        </button>
        <button class="btn-primary" id="btn-export">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          导出 PNG
        </button>
      </div>
    </div>

  </div>

</div>

<canvas id="export-canvas"></canvas>
<div class="toast" id="toast"></div>

  var PLACEHOLDERS = {
    '5': '例如：1 2 3. 4 | #1 #2 #3 #4 #5 #6 | b5 6 7 1 | 5-- 5-- 5 6',
    '2': '例如：1 2 3. 4 | #1 #2 #3 | b2 b3 b4 b5 b6 b7 | 5-- 5-- 5 6'
  };

  function setMode(mode){
    if(mode !== '5' && mode !== '2') return;
    if(currentMode === mode) return;
    currentMode = mode;
    currentImageData = (mode === '5') ? IMAGE_DATA : IMAGE_DATA_2;
    document.getElementById('btn-mode-5').classList.toggle('active', mode === '5');
    document.getElementById('btn-mode-2').classList.toggle('active', mode === '2');
    document.getElementById('btn-mode-5').setAttribute('aria-pressed', mode === '5');
    document.getElementById('btn-mode-2').setAttribute('aria-pressed', mode === '2');
    document.querySelector('.input-panel .panel-hint').innerHTML = HINTS[mode];
    inputEl.placeholder = PLACEHOLDERS[mode];
    update();
    showToast('已切换到全按作 ' + mode);
  }

  var inputEl = document.getElementById('input-box');
  var outputWrap = document.getElementById('output-wrap');
  var outputEl = document.getElementById('output');
  var emptyTip = document.getElementById('empty-tip');
  var errorBar = document.getElementById('error-bar');
  var toastEl = document.getElementById('toast');

  // ---------- 音高映射 ----------
  function resolveNote(token){
    // token: 单个数字 '0'-'9' ，或 '#'+数字 ，或 'b'+数字
    if(token.length === 1){
      var d = token;
      if(d === '0') return {ok:true, img:null, isRest:true};
      if(currentImageData.hasOwnProperty(d)) return {ok:true, img:currentImageData[d], isRest:false};
      return {ok:false};
    }
    if(token.length === 2){
      var prefix = token[0], num = token[1];
      if(prefix === '#'){
        var key = '_' + num;
        if(currentImageData.hasOwnProperty(key)) return {ok:true, img:currentImageData[key], isRest:false};
        return {ok:false};
      }
      if(prefix === 'b'){
        var key2 = 'b' + num;
        if(currentImageData.hasOwnProperty(key2)) return {ok:true, img:currentImageData[key2], isRest:false};
        return {ok:false};
      }
    }
    return {ok:false};
  }

  // ---------- 解析 ----------
  // 返回 { rows: [...], errors: [{char, index}] }
  function parseScore(text){
    var errors = [];
    var lines = text.split('\n');
    var rows = [];

    lines.forEach(function(line){
      var lineTrimmed = line.trim();
      if(lineTrimmed.length === 0) return; // 跳过空行

      var measuresRaw = lineTrimmed.split('|');
      var measures = [];

      measuresRaw.forEach(function(measureText){
        var trimmed = measureText.trim();
        if(trimmed.length === 0) return; // 跳过空小节（连续 | 或首尾 |）
        var beatStrs = trimmed.split(/\s+/).filter(function(s){ return s.length > 0; });
        var beats = [];
        beatStrs.forEach(function(beatStr){
          var cells = [];
          var i = 0;
          while(i < beatStr.length){
            var c = beatStr[i];
            if(c === '#' || c === 'b'){
              var next = beatStr[i+1];
              if(next && /[0-9]/.test(next)){
                var token = c + next;
                var res = resolveNote(token);
                if(res.ok){
                  cells.push({type:'note', char:token, img:res.img, isRest:false});
                } else {
                  cells.push({type:'error', char:token});
                  errors.push(token);
                }
                i += 2;
              } else {
                cells.push({type:'error', char:c});
                errors.push(c);
                i += 1;
              }
            } else if(/[0-9]/.test(c)){
              var res2 = resolveNote(c);
              if(res2.ok){
                cells.push({type: res2.isRest ? 'rest' : 'note', char:c, img:res2.img});
              } else {
                cells.push({type:'error', char:c});
                errors.push(c);
              }
              i += 1;
            } else if(c === '.' || c === '-'){
              cells.push({type:'blank', char:c});
              i += 1;
            } else {
              cells.push({type:'error', char:c});
              errors.push(c);
              i += 1;
            }
          }
          beats.push(cells);
        });
        measures.push(beats);
      });

      if(measures.length > 0){
        rows.push(measures);
      }
    });

    return {rows: rows, errors: errors};
  }

  // ---------- 渲染到 DOM ----------
  function renderCellDom(cell){
    var cellDiv = document.createElement('div');
    cellDiv.className = 'cell';

    var charDiv = document.createElement('div');
    charDiv.className = 'cell-char' + (cell.type === 'rest' ? ' rest' : cell.type === 'blank' ? ' blank' : cell.type === 'error' ? ' err' : '');
    charDiv.textContent = cell.char;
    cellDiv.appendChild(charDiv);

    var imgDiv = document.createElement('div');
    if(cell.type === 'note'){
      imgDiv.className = 'cell-img';
      var img = document.createElement('img');
      img.src = cell.img;
      img.alt = cell.char;
      imgDiv.appendChild(img);
    } else if(cell.type === 'error'){
      imgDiv.className = 'cell-img err-box';
    } else {
      imgDiv.className = 'cell-img';
    }
    cellDiv.appendChild(imgDiv);

    return cellDiv;
  }

  function renderScoreDom(parsed){
    outputEl.innerHTML = '';

    if(parsed.rows.length === 0){
      outputWrap.classList.add('empty');
      return;
    }
    outputWrap.classList.remove('empty');

    parsed.rows.forEach(function(measures){
      var rowDiv = document.createElement('div');
      rowDiv.className = 'row';

      measures.forEach(function(beats, mIdx){
        if(mIdx > 0){
          var bar = document.createElement('div');
          bar.className = 'barline';
          rowDiv.appendChild(bar);
        }
        var measureDiv = document.createElement('div');
        measureDiv.className = 'measure';
        beats.forEach(function(cells){
          var beatDiv = document.createElement('div');
          beatDiv.className = 'beat';
          cells.forEach(function(cell){
            beatDiv.appendChild(renderCellDom(cell));
          });
          measureDiv.appendChild(beatDiv);
        });
        rowDiv.appendChild(measureDiv);
      });

      outputEl.appendChild(rowDiv);
    });
  }

  // ---------- 错误提示 ----------
  function renderErrors(errors){
    if(errors.length === 0){
      errorBar.classList.remove('show');
      errorBar.textContent = '';
      return;
    }
    var uniq = Array.from(new Set(errors));
    errorBar.textContent = '⚠ 无法识别的符号：' + uniq.join('、') + '，映射表中没有对应的洞洞谱，请检查输入。';
    errorBar.classList.add('show');
  }

  // ---------- 主流程 ----------
  var lastParsed = null;

  function update(){
    var text = inputEl.value;
    var parsed = parseScore(text);
    lastParsed = parsed;
    renderScoreDom(parsed);
    renderErrors(parsed.errors);
  }

  inputEl.addEventListener('input', update);

  // ---------- 工具栏 ----------
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){
      toastEl.classList.remove('show');
    }, 1800);
  }

  document.getElementById('btn-clear').addEventListener('click', function(){
    inputEl.value = '';
    update();
    inputEl.focus();
  });

  document.getElementById('btn-copy').addEventListener('click', function(){
    var text = inputEl.value;
    if(!text){ showToast('还没有输入内容'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('已复制简谱文本');
      }).catch(function(){
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制简谱文本'); }
    catch(e){ showToast('复制失败，请手动选择文本'); }
    document.body.removeChild(ta);
  }

  // ---------- 导出 PNG ----------
  document.getElementById('btn-export').addEventListener('click', function(){
    if(!lastParsed || lastParsed.rows.length === 0){
      showToast('还没有可导出的内容');
      return;
    }
    var titleVal = (document.getElementById('title-box').value || '').trim();
    if(!titleVal){
      showToast('请填写谱子名字');
      return;
    }
    exportPNG(lastParsed);
  });

  function preloadImages(rows){
    var srcs = new Set();
    rows.forEach(function(measures){
      measures.forEach(function(beats){
        beats.forEach(function(cells){
          cells.forEach(function(cell){
            if(cell.type === 'note' && cell.img) srcs.add(cell.img);
          });
        });
      });
    });
    var arr = Array.from(srcs);
    return Promise.all(arr.map(function(src){
      return new Promise(function(resolve){
        var img = new Image();
        img.onload = function(){ resolve(); };
        img.onerror = function(){ resolve(); };
        img.src = src;
        img._cachedSrc = src;
        preloadImages._cache[src] = img;
      });
    }));
  }
  preloadImages._cache = {};

  function measureRowWidth(measures, ctx){
    var w = 0;
    measures.forEach(function(beats, mIdx){
      if(mIdx > 0) w += BARLINE_GAP * 2 + 1;
      w += MEASURE_PAD; // left pad of measure
      beats.forEach(function(cells, bIdx){
        if(bIdx > 0) w += GROUP_GAP;
        cells.forEach(function(cell, cIdx){
          if(cIdx > 0) w += BEAT_GAP;
          w += cellWidth(cell, ctx);
        });
      });
      w += MEASURE_PAD; // right pad
    });
    return w;
  }

  function cellWidth(cell, ctx){
    ctx.font = '500 ' + CHAR_FONT_SIZE + 'px "JetBrains Mono", monospace';
    var textW = ctx.measureText(cell.char).width;
    var imgW = cell.type === 'note' ? 20 : (cell.type === 'error' ? 20 : 4);
    return Math.max(textW, imgW, CELL_MIN_W - 8) + 8;
  }

  function exportPNG(parsed){
    var canvas = document.getElementById('export-canvas');
    var ctx = canvas.getContext('2d');

    preloadImages(parsed.rows).then(function(){
      // 计算尺寸
      var maxRowW = 0;
      parsed.rows.forEach(function(measures){
        maxRowW = Math.max(maxRowW, measureRowWidth(measures, ctx));
      });
      var titleText = (document.getElementById('title-box').value || '').trim();
      var hasTitle = titleText.length > 0;
      var PAD_X = 48, PAD_TOP = hasTitle ? 100 : 84, PAD_BOTTOM = 56;
      var rowContentH = CHAR_ROW_HEIGHT + CHAR_GAP + IMG_HEIGHT;
      var totalH = PAD_TOP + parsed.rows.length * rowContentH + (parsed.rows.length - 1) * ROW_GAP + PAD_BOTTOM;
      var totalW = maxRowW + PAD_X * 2;

      var scale = 2; // 提高清晰度
      canvas.width = totalW * scale;
      canvas.height = totalH * scale;
      ctx.scale(scale, scale);

      // 背景
      var grad = ctx.createLinearGradient(0, 0, 0, totalH);
      grad.addColorStop(0, '#eef0f6');
      grad.addColorStop(1, '#f1eef0');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, totalW, totalH);

      // 标题
      ctx.fillStyle = '#a06e73';
      ctx.textBaseline = 'alphabetic';
      if(hasTitle){
        // 谱名作为大标题（与原标题同样式）
        ctx.font = '700 22px "Noto Serif SC", serif';
        ctx.textAlign = 'center';
        ctx.fillText(titleText, totalW/2, 42);
        // 副标题：洞洞谱·全按作x（字号调小，放在下方）
        ctx.font = '400 15px "Noto Serif SC", serif';
        ctx.fillText('洞 洞 谱 · 全按作 ' + currentMode, totalW/2, 64);
        // 制谱信息（副标题行最右侧，字号改小两号）
        ctx.textAlign = 'right';
        ctx.font = '400 13px "Noto Serif SC", serif';
        ctx.fillText('制谱工具:小红书@9458234621', totalW - PAD_X, 64);
        // 下划线
        ctx.strokeStyle = 'rgba(196,142,151,0.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(totalW/2 - 60, 78);
        ctx.lineTo(totalW/2 + 60, 78);
        ctx.stroke();
      }else{
        ctx.font = '700 22px "Noto Serif SC", serif';
        ctx.textAlign = 'center';
        ctx.fillText('洞 洞 谱 · 全按作 ' + currentMode, totalW/2, 42);
        // 制谱信息（标题行最右侧，字号改小两号）
        ctx.textAlign = 'right';
        ctx.font = '700 20px "Noto Serif SC", serif';
        ctx.fillText('制谱工具:小红书@9458234621', totalW - PAD_X, 42);
        ctx.strokeStyle = 'rgba(196,142,151,0.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(totalW/2 - 60, 56);
        ctx.lineTo(totalW/2 + 60, 56);
        ctx.stroke();
      }

      // 逐行绘制
      var y = PAD_TOP;
      parsed.rows.forEach(function(measures){
        var x = PAD_X + (totalW - PAD_X*2 - measureRowWidth(measures, ctx)) / 2;
        measures.forEach(function(beats, mIdx){
          if(mIdx > 0){
            ctx.strokeStyle = 'rgba(196,142,151,0.6)';
            ctx.lineWidth = 1;
            x += BARLINE_GAP;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + rowContentH);
            ctx.stroke();
            x += BARLINE_GAP + 1;
          }
          x += MEASURE_PAD;
          beats.forEach(function(cells, bIdx){
            if(bIdx > 0) x += GROUP_GAP;
            cells.forEach(function(cell, cIdx){
              if(cIdx > 0) x += BEAT_GAP;
              var w = cellWidth(cell, ctx);
              var cx = x + w/2;

              // 字符
              ctx.textAlign = 'center';
              ctx.font = '500 ' + CHAR_FONT_SIZE + 'px "JetBrains Mono", monospace';
              if(cell.type === 'error') ctx.fillStyle = '#b3423f';
              else if(cell.type === 'rest' || cell.type === 'blank') ctx.fillStyle = 'rgba(141,139,150,0.75)';
              else ctx.fillStyle = '#2c2b32';
              ctx.fillText(cell.char, cx, y + CHAR_ROW_HEIGHT - 5);

              // 图片
              if(cell.type === 'note' && cell.img){
                var imgObj = preloadImages._cache[cell.img];
                if(imgObj && imgObj.complete && imgObj.naturalWidth){
                  var ih = IMG_HEIGHT;
                  var iw = imgObj.naturalWidth * (ih / imgObj.naturalHeight);
                  ctx.drawImage(imgObj, cx - iw/2, y + CHAR_ROW_HEIGHT + CHAR_GAP, iw, ih);
                }
              } else if(cell.type === 'error'){
                ctx.strokeStyle = '#b3423f';
                ctx.setLineDash([3,2]);
                ctx.strokeRect(cx - 10, y + CHAR_ROW_HEIGHT + CHAR_GAP, 20, 20);
                ctx.setLineDash([]);
              }

              x += w;
            });
          });
          x += MEASURE_PAD;
        });
        y += rowContentH + ROW_GAP;
      });

      // 底部寄语
      ctx.fillStyle = '#a06e73';
      ctx.font = '400 15px "Noto Serif SC", serif';
      ctx.textAlign = 'center';
      ctx.fillText('愿旋律与你相伴', totalW/2, totalH - 24);

      // 下载
      canvas.toBlob(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '洞洞谱.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
        showToast('已导出 PNG');
      }, 'image/png');
    });
  }

  document.getElementById('btn-mode-5').addEventListener('click', function(){ setMode('5'); });
  document.getElementById('btn-mode-2').addEventListener('click', function(){ setMode('2'); });

  function resizePanels(){
    var viewportWidth = window.innerWidth;
    var inputWidth = viewportWidth * 0.25;
    var outputWidth = viewportWidth * 0.5;

    var inputPanel = document.querySelector('.panel.input-panel');
    var outputPanel = document.querySelector('.panel.output-panel');

    if(inputPanel) inputPanel.style.width = inputWidth + 'px';
    if(outputPanel) outputPanel.style.width = outputWidth + 'px';
  }

  window.addEventListener('resize', resizePanels);

  resizePanels();

  update();

})();

</script>
